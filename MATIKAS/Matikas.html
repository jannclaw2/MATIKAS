<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MATIKAS.</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=UnifrakturCook:wght@700&display=swap');

.section-title {
  display: inline-block;
  margin: 52px auto 18px;
  min-width: 220px;
  font-size: clamp(1.2rem, 2vw, 2.2rem);
  line-height: 1.2;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 800;
  color: rgba(255,255,255,0.96);
  text-shadow: 0 1px 0 rgba(0,0,0,0.75), 0 0 8px rgba(255,255,255,0.12);
  -webkit-text-stroke: 1px rgba(255,255,255,0.18);
  border-bottom: 1px solid rgba(255,255,255,0.18);
  padding-bottom: 8px;
}

.dayones {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 25px;
  margin-top: 20px;
  perspective: 1000px;
}

.mini-card {
  width: 120px;
  flex: 0 0 120px;
  text-align: center;
  background: #000000;
  padding: 15px 10px;
  border-radius: 10px;
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
  transform-style: preserve-3d;
  transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
  will-change: transform;
  position: relative;
  overflow: hidden;
}

.mini-card:hover {
  box-shadow: 0 0 25px 2px rgba(246, 246, 247, 0.55),
              0 20px 40px rgba(0,0,0,0.5);
}

.mini-card::before {
  content: '';
  position: absolute;
  top: 0; left: -75%;
  width: 50%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.25), transparent);
  transform: skewX(-20deg);
  z-index: 3;
  transition: left 0.75s ease;
  pointer-events: none;
}

.mini-card:hover::before {
  left: 130%;
}

.mini-card img {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
  pointer-events: none;
  filter: grayscale(100%) brightness(0.75);
  transform: scale(1);
  transition: transform 0.6s ease, filter 0.6s ease;
}

.mini-card:hover img {
  filter: grayscale(0%) brightness(1);
  transform: scale(1.15);
}

.mini-card p {
  pointer-events: none;
  margin: 0;
  font-size: 10px;
  color: #cfcfcf;
}

.mini-card h4 {
  margin: 8px 0 2px 0;
  font-size: 13px;
  color: #fcf8f8;
  pointer-events: none;
  position: relative;
  transition: letter-spacing 0.3s ease;
}

.mini-card:hover h4 {
  letter-spacing: 1.5px;
}

.mini-card .underline {
  display: block;
  height: 2px;
  width: 0%;
  background: rgba(244, 244, 245, 0.9);
  margin: 6px auto 0;
  transition: width 0.4s ease;
}

.mini-card:hover .underline {
  width: 60%;
}

body {
  margin: 0;
  padding: 40px 20px 60px 20px;
  box-sizing: border-box;
  -ms-overflow-style: none;
  scrollbar-width: none;
  background: url('https://file.garden/aqSTqeNs4RWiv0uj/GGS.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  color: rgb(250, 248, 248);
  font-family: Arial;
  text-align: center;
}

html {
  -ms-overflow-style: none;
  scrollbar-width: none;
}

html::-webkit-scrollbar {
  display: none;
}

nav {
  position: relative;
  z-index: 10;
  width: calc(100% + 40px);
  margin: -40px -20px 0 -20px;
  padding: 14px 18px;
  background: rgba(0, 0, 0, 0.8);
  border-top: 1px solid rgba(255,255,255,0.18);
  border-bottom: 1px solid rgba(255,255,255,0.14);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

nav a {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 18px;
  border-radius: 12px;
  color: rgba(255,255,255,0.95);
  margin: 0;
  text-decoration: none;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 0.2s ease, opacity 0.2s ease;
  font-family: 'Orbitron', 'Inter', Arial, sans-serif;
  background: transparent;
  border: none;
}

nav a:hover {
  color: #ffffff;
  background: transparent;
  opacity: 0.9;
}

.glow {
  font-size: 50px;
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 20px rgba(255, 255, 255, 0.6), 2px 2px 4px rgba(0,0,0,0.8);
  -webkit-text-stroke: 0.5px rgba(0, 0, 0, 0.2);
}

.profile {
  margin-top: 30px;
  width: 150px;
  border-radius: 50%;
  box-shadow: 0 0 20px rgb(245, 243, 243);
}

.members {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  perspective: 1000px;
}

.card {
  background: #000000;
  padding: 20px;
  border-radius: 10px;
  width: 150px;
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
  transform-style: preserve-3d;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  will-change: transform;
  position: relative;
  overflow: hidden;
}

.card img {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  object-fit: cover;
  pointer-events: none;
  transition: transform 0.4s ease;
}

.card:hover img {
  transform: scale(1.12);
}

.card h3, .card p {
  pointer-events: none;
}

.card:hover {
  box-shadow: 0 0 45px rgba(255, 255, 255, 0.95), 0 0 80px rgba(255, 255, 255, 0.4);
  transform: translateY(-8px) scale(1.05);
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: -75%;
  width: 50%;
  height: 100%;
  background: linear-gradient(to right, transparent 0%, rgba(255, 255, 255, 0.25) 50%, transparent 100%);
  transform: skewX(-25deg);
  transition: left 0.7s ease;
  pointer-events: none;
  z-index: 1;
}

.card:hover::before {
  left: 125%;
}

#intro {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(10px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 999;
  opacity: 1;
  transition: opacity 1.5s ease;
}

#intro.fade-out {
  opacity: 0;
  pointer-events: none;
}

#intro h1 {
  color: rgb(252, 249, 249);
}

#intro button {
  margin-top: 20px;
  padding: 10px 25px;
  background: transparent;
  border: 2px solid rgb(252, 249, 249);
  color: rgb(252, 249, 249);
  font-weight: bold;
  cursor: pointer;
  border-radius: 5px;
}

#intro button:hover {
  background: rgb(252, 249, 249);
  color: black;
}

#music-widget {
  position: fixed;
  bottom: 15px;
  right: 15px;
  z-index: 998;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(20, 20, 20, 0.85);
  backdrop-filter: blur(12px);
  border-radius: 10px;
  padding: 6px 14px 6px 6px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  font-family: Arial;
}

#music-widget .widget-art {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  animation: spin 3s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.widget-info {
  display: flex;
  flex-direction: column;
  text-align: left;
  line-height: 1.1;
  max-width: 110px;
}

.widget-title {
  font-size: 11px;
  font-weight: bold;
  color: #fff;
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.widget-artist {
  font-size: 9px;
  color: #bbb;
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#widget-playpause {
  background: none;
  border: none;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  padding: 0 2px;
  flex-shrink: 0;
}

#widget-volume {
  -webkit-appearance: none;
  appearance: none;
  width: 60px;
  height: 4px;
  border-radius: 2px;
  background: #555;
  outline: none;
  cursor: pointer;
}

#widget-volume::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  cursor: grab;
  box-shadow: 0 0 4px rgba(0,0,0,0.5);
}

#widget-volume::-webkit-slider-thumb:active {
  cursor: grabbing;
}

#widget-volume::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  border: none;
  cursor: grab;
}

#intro.fade-out {
  opacity: 0;
  transform: translateY(-10px);
  transition: opacity 1.2s ease, transform 1.2s ease;
}

.section-title {
  position: relative;
  display: inline-block;
  min-width: 260px;
  min-height: 42px;
  margin: 18px auto 18px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: clamp(1.5rem, 2.5vw, 2.2rem);
  font-weight: 800;
  color: rgba(255,255,255,0.96);
  -webkit-text-stroke: 1.2px rgba(255,255,255,0.35);
  text-shadow:
    0 0 8px rgba(255,255,255,0.9),
    0 0 20px rgba(255,255,255,0.6),
    0 0 40px rgba(255,255,255,0.35),
    0 2px 4px rgba(0,0,0,0.8);
}

.section-title .title-base {
  visibility: hidden;
  display: inline-block;
  white-space: nowrap;
}

.section-title .title-typed {
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  white-space: nowrap;
}

.profile-modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.22s ease, visibility 0.22s ease;
  z-index: 2000;
}

.profile-modal.is-open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.profile-modal.closing {
  opacity: 0;
  visibility: hidden;
}

.profile-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.68);
  backdrop-filter: blur(6px);
}

.profile-modal-panel {
  position: relative;
  width: min(700px, 82vw);
  background: rgba(12, 12, 12, 0.96);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 18px;
  box-shadow: 0 28px 80px rgba(0,0,0,0.72), inset 0 0 0 1px rgba(255,255,255,0.04);
  transform: translateY(18px) scale(0.96);
  opacity: 0;
  transition: transform 0.22s ease, opacity 0.22s ease;
  overflow: hidden;
}

.profile-modal-panel::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01) 35%, rgba(0,0,0,0.22));
  z-index: 2;
  pointer-events: none;
}

.profile-modal.is-open .profile-modal-panel {
  transform: translateY(0) scale(1);
  opacity: 1;
}

.profile-modal.closing .profile-modal-panel {
  transform: translateY(12px) scale(0.98);
  opacity: 0;
}

.profile-modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.16);
  background: rgba(255,255,255,0.06);
  color: white;
  font-size: 20px;
  cursor: pointer;
  z-index: 3;
}

.profile-modal-content {
  position: relative;
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  min-height: 340px;
  max-height: 340px;
  background: #000;
}

.profile-modal-image {
  position: relative;
  z-index: 1;
  width: 260px;
  height: 340px;
  min-width: 260px;
  min-height: 340px;
  object-fit: cover;
  object-position: center;
  display: block;
  background: #f5f5f5;
}

.profile-modal-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  z-index: 0;
  opacity: 0.72;
  filter: brightness(0.72) saturate(1.05) contrast(1.08);
}

.profile-modal-text {
  position: relative;
  z-index: 1;
  padding: 32px 26px 26px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: linear-gradient(90deg, rgba(0,0,0,0.38), rgba(0,0,0,0.12) 40%, rgba(0,0,0,0.28));
  backdrop-filter: blur(1px);
}

.profile-modal-name {
  margin: 0;
  font-family: 'UnifrakturCook', 'Old English Text MT', serif;
  font-size: clamp(2.4rem, 3.6vw, 4rem);
  letter-spacing: 0.04em;
  line-height: 1;
  text-shadow: 0 2px 14px rgba(0,0,0,0.9), 0 0 18px rgba(255,255,255,0.12);
}

.profile-modal-handle {
  margin: 8px 0 0;
  color: #d0d9ef;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.15rem;
  letter-spacing: 0.04em;
  opacity: 0.9;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}

.profile-modal-role {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.profile-role-badge {
  display: inline-block;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 0 12px rgba(0,0,0,0.25);
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
}

.profile-modal-bio {
  margin-top: 18px;
  line-height: 1.7;
  color: #e9edf6;
  opacity: 0.9;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}

@media (max-width: 720px) {
  .profile-modal-content {
    grid-template-columns: 1fr;
    max-height: none;
  }

  .profile-modal-image {
    width: 100%;
    min-width: 0;
    min-height: 220px;
    height: 220px;
  }
}
</style>
</head>

<body>

<div id="intro">
  <h1>WELCOME TO MY FAMILY</h1>
  <button onclick="enterSite()">VIEW</button>
</div>

<nav>
  <a onclick="showPage('home')">Kish Bloodline</a>
</nav>

<div id="home">
  <h1 class="glow"></h1>
  <img src="https://file.garden/aqSTqeNs4RWiv0uj/MMMM_rotation_left_right.gif" class="profile">
</div>

<h2 class="section-title">Mother</h2>

<div class="members" id="motherList"></div>

<h2 class="section-title">Kish's Sons</h2>

<div class="dayones" id="sonsList"></div>

<audio id="bgmusic" loop src="https://file.garden/aqSTqeNs4RWiv0uj/Gat%20Putch%20-%20MATIKAS%20(feat.%20Smugglaz%2C%20Icetizy%20Uncle%20Dags)%20Official%20Audio.mp3" preload="auto"></audio>

<div id="music-widget">
  <img class="widget-art" src="https://file.garden/aqSTqeNs4RWiv0uj/MMMM.png">
  <div class="widget-info">
    <p class="widget-title">MATIKAS</p>
    <p class="widget-artist">Gat Putch</p>
  </div>
  <button id="widget-playpause">❚❚</button>
  <input type="range" id="widget-volume" min="0" max="1" step="0.01" value="1">
</div>

<div class="profile-modal" id="profileModal" aria-hidden="true">
  <div class="profile-modal-backdrop" data-close-modal></div>
  <div class="profile-modal-panel" role="dialog" aria-modal="true" aria-labelledby="profileModalName">
    <button class="profile-modal-close" type="button" data-close-modal aria-label="Close profile">×</button>
    <div class="profile-modal-content">
      <img class="profile-modal-image" id="profileModalImage" alt="Profile preview">
      <video class="profile-modal-video" id="profileModalVideo" playsinline autoplay muted loop preload="auto"></video>
      <div class="profile-modal-text">
        <h3 class="profile-modal-name" id="profileModalName">Name</h3>
        <p class="profile-modal-handle" id="profileModalHandle">@handle</p>
        <span class="profile-modal-role" id="profileModalRole">Family</span>
        <p class="profile-modal-bio" id="profileModalBio">Bloodline member.</p>
      </div>
    </div>
  </div>
</div>

<script>
  function showPage(page) {
    const target = document.getElementById(page);
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  const bg = document.getElementById('bgmusic');

  function playMusic() {
    if (!bg) return;
    bg.play().catch(function () {});
  }

  function enterSite() {
    const intro = document.getElementById('intro');
    if (intro) {
      intro.classList.add('fade-out');
      setTimeout(function () {
        intro.style.display = 'none';
      }, 1500);
    }
    playMusic();
  }
</script>

<script src="scripts/anti-inspect.js"></script>
<script src="scripts/family-data.js"></script>
<script src="scripts/card-effects.js"></script>
<script src="scripts/music-ui.js"></script>
<script src="scripts/mini-card-typing.js"></script>
<script src="scripts/section-effects.js"></script>
<script src="scripts/profile-modal.js"></script>

</body>
</html>
